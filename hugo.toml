baseURL = 'https://ilovespectraltheorem.github.io/'
locale = 'en-gb'
title = 'ilovespectraltheorem'
theme = 'hugo-xmin'

[permalinks]
  post = '/post/:year/:month/:day/:slug/'

[[menus.main]]
  name = 'Home'
  url = '/'
  weight = 1
[[menus.main]]
  name = 'Solutions'
  url = '/solutions/'
  weight = 2
[[menus.main]]
  name = 'Projects'
  url = '/projects/'
  weight = 3
[[menus.main]]
  name = 'Play'
  url = '/play/'
  weight = 4
[[menus.main]]
  name = 'Posts'
  url = '/post/'
  weight = 5
[[menus.main]]
  name = 'About'
  url = '/about/'
  weight = 6

[params]
  description = 'Notes on mathematics by a Pure Maths student at Imperial College London.'
  footer = '&copy; ilovespectraltheorem {Year} | [GitHub](https://github.com/ilovespectraltheorem) | [RSS](/index.xml)'

[markup.goldmark.renderer]
  unsafe = true

# Protect LaTeX from Markdown: $...$, \(...\) inline; $$...$$, \[...\] display
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[caches.images]
  dir = ':cacheDir/images'
