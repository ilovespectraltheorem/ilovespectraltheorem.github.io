baseURL = 'https://ilovespectraltheorem.github.io/'
locale = 'en-gb'
title = 'ilovespectraltheorem'
theme = 'hugo-xmin'

[permalinks]
  post = '/post/:year/:month/:day/:slug/'

[[menus.main]]
  name = 'Home'
  url = '/'
  weight = 1
[[menus.main]]
  name = 'About'
  url = '/about/'
  weight = 2
[[menus.main]]
  name = 'Posts'
  url = '/post/'
  weight = 3
[[menus.main]]
  name = 'Tags'
  url = '/tags/'
  weight = 4
[[menus.main]]
  name = 'Subscribe'
  url = '/index.xml'
  weight = 5

[params]
  footer = '&copy; ilovespectraltheorem {Year} | [GitHub](https://github.com/ilovespectraltheorem)'

[markup.goldmark.renderer]
  unsafe = true
